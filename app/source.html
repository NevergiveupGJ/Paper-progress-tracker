<title>Paper Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#E9EDEF; --line:#D5DCE0; --ink:#15202B; --ink2:#4A5763; --ink3:#6B7883;
  --accent:#2446C7; --accent-soft:#E3E9FB; --on-accent:#fff;
  --done:#2F8F5B; --done-soft:#D5EEDF; --done-ink:#1E6B41;
  --half:#C98A0C; --half-soft:#FBEBC6; --half-ink:#7F5300;
  --warn:#B4432F; --warn-soft:#F8DDD6;
  --p1:#9FB3EC; --p2:#8CCBA5; --p3:#E9AE86;
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --surface:#172029; --sunk:#1E2A34; --line:#2C3A46; --ink:#E6ECF0; --ink2:#A9B6C0; --ink3:#8795A0;
    --accent:#8AA4FF; --accent-soft:#1F2B55; --on-accent:#0F151B;
    --done:#5CC48A; --done-soft:#1C3A2A; --done-ink:#8EE0B0;
    --half:#E7B24A; --half-soft:#3F3217; --half-ink:#F2CB7A;
    --warn:#F08A74; --warn-soft:#44221B;
    --p1:#4A5E9E; --p2:#3F7D58; --p3:#9A6445;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --surface:#172029; --sunk:#1E2A34; --line:#2C3A46; --ink:#E6ECF0; --ink2:#A9B6C0; --ink3:#8795A0;
  --accent:#8AA4FF; --accent-soft:#1F2B55; --on-accent:#0F151B;
  --done:#5CC48A; --done-soft:#1C3A2A; --done-ink:#8EE0B0;
  --half:#E7B24A; --half-soft:#3F3217; --half-ink:#F2CB7A;
  --warn:#F08A74; --warn-soft:#44221B;
  --p1:#4A5E9E; --p2:#3F7D58; --p3:#9A6445;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:20px;margin:0}
.top .meta{font-size:13px;color:var(--ink3)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);background:var(--sunk);font-weight:600;border-radius:8px 8px 0 0}
.ghead .phases{display:flex;gap:8px;font-size:10px;letter-spacing:.05em;text-transform:none}
.ghead .phases i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.sub{padding:5px 12px 3px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line)}

.line{display:grid;grid-template-columns:28px minmax(200px,1fr) auto 38px minmax(0,230px) auto;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line)}
.ghead+.line,.sub+.line{border-top:none}
.mark{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--ink3)}
.grip{border:0;background:none;padding:2px 1px;color:var(--ink3);font-size:15px;line-height:1;cursor:grab;touch-action:none;border-radius:4px}
.grip:hover{color:var(--accent);background:var(--accent-soft)}
.group.focusblk{border:2px solid var(--accent)}
.group.focusblk .ghead{background:var(--accent-soft);color:var(--accent)}
.zone{min-height:6px}
body.dragging-now .zone{min-height:44px}
@media (pointer:coarse){.grip{min-width:36px;min-height:36px;font-size:20px;-webkit-touch-callout:none;-webkit-user-select:none}}
.zhint{padding:8px 12px;font-size:13px;color:var(--ink3);border-top:1px dashed var(--line)}
.line.dragging{position:fixed;z-index:30;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.2);border:1px solid var(--accent);border-radius:8px;pointer-events:none;opacity:.96}
.ph{margin:4px 10px;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:8px}
body.dragging-now{user-select:none;cursor:grabbing}
.mark i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3);flex:none}
.mark.focus i{background:var(--accent);border-color:var(--accent)} .mark.focus{color:var(--accent);font-weight:600}
.mark.warm i{border-color:var(--accent)}
.tcell{min-width:0;display:flex;flex-direction:column;gap:1px}
.trow{display:flex;align-items:center;gap:6px;min-width:0}
.ttl{border:0;background:none;padding:0;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ttl:hover{text-decoration:underline;text-decoration-color:var(--ink3)}
.role{flex:none;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap}
.role.main{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.role.unsure{border-style:dashed}
.role:hover{border-color:var(--ink3)}
.folder{font-family:var(--mono);font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;max-width:100%;cursor:pointer}
.folder::before{content:"";display:inline-block;width:11px;height:8px;margin-right:5px;border:1.5px solid currentColor;border-radius:1px 2px 2px 2px;vertical-align:-1px}
.folder:hover{color:var(--accent);text-decoration:underline}
.folderbtns{display:flex;gap:6px;flex-wrap:wrap}
.where{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;row-gap:4px}
.where .folder{flex:0 1 auto;min-width:0}
.lnk{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;white-space:nowrap;cursor:pointer}
.lnk:hover{border-color:var(--accent)}
.links{display:flex;flex-direction:column;gap:4px}
.linkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.linkrow .u{font-family:var(--mono);font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder.bad{color:var(--warn)}
.strip{display:flex;gap:2px;align-items:center}
.strip .gap{width:5px;flex:none}
.cell{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-size:11px;padding:0;color:transparent;position:relative;flex:none}
.cell::after{content:"";position:absolute;left:3px;right:3px;bottom:-4px;height:2px;border-radius:1px;background:var(--pc)}
.cell.p1{--pc:var(--p1)} .cell.p2{--pc:var(--p2)} .cell.p3{--pc:var(--p3)}
.cell.v1{background:var(--done);border-color:var(--done);color:#fff}
.cell.v5{background:var(--half-soft);border-color:var(--half);color:var(--half-ink)}
.cell.hint{box-shadow:0 0 0 2px var(--half)}
.pct{font-size:13px;color:var(--ink2);text-align:right}
.now{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.go{display:flex;align-items:center;gap:6px;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px 3px 4px;font-size:13px;text-align:left}
.go:hover{border-color:var(--accent)}
.go:focus-visible{outline-offset:-2px}
.go i{flex:none;font-style:normal;font-size:11px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:2px 5px}
.go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go.on{border-color:var(--accent);background:var(--accent-soft)}
.now b{color:var(--ink);font-weight:500}
.now .late{color:var(--warn)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.ok{border-color:var(--done);color:var(--done-ink);font-weight:600}
.btn.ok:hover{background:var(--done-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.x{padding:4px 8px;color:var(--ink3)}
.empty{padding:14px 12px;color:var(--ink3);font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink3)}
.foot .cell{display:inline-grid;width:14px;height:14px;font-size:9px;vertical-align:-2px;margin-right:3px}
.foot .cell::after{display:none}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.newf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding:8px 12px;border-top:1px solid var(--line)}
.newf:first-child{border-top:none}
.newf code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:4px;word-break:break-all}
details.arch>summary{list-style:none;cursor:pointer}
details.arch>summary::-webkit-details-marker{display:none}
details.arch:not([open])>summary{border-radius:8px}
.archrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);font-size:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px 12px}

@media (max-width:900px){
  .line{grid-template-columns:22px minmax(0,1fr) auto auto;row-gap:6px;padding:8px 10px}
  .line .mark{grid-column:1;grid-row:1 / span 3;align-self:start}
  .line .mark .num{display:none}
  .line .tcell{grid-column:2;grid-row:1}
  .line .pct{grid-column:3;grid-row:1}
  .line .acts{grid-column:4;grid-row:1}
  .line .strip{grid-column:2 / -1;grid-row:2}
  .line .strip .cell{flex:1 1 0;min-width:0;width:auto;height:28px}
  .line .now{grid-column:2 / -1;grid-row:3}
  .line .now.plain{display:none}
  .ghead .phases{display:none}
}
@media (pointer:coarse) and (max-width:900px){.line{grid-template-columns:36px minmax(0,1fr) auto auto}}
@media (max-width:560px){
  .line{grid-template-columns:24px minmax(0,1fr) auto}
  .line .mark{grid-row:1 / span 3}
  .line .tcell{grid-column:2;grid-row:1}
  .line .pct{grid-column:3;grid-row:1}
  .line .strip{grid-column:2 / -1;grid-row:2}
  .line .now{grid-column:2;grid-row:3}
  .line .acts{grid-column:3;grid-row:3}
  .trow{flex-wrap:wrap;row-gap:2px}
}
@media (pointer:coarse) and (max-width:560px){.line{grid-template-columns:36px minmax(0,1fr) auto}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:11;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.drawer header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer h2{font-family:var(--display);font-size:18px;margin:0;text-wrap:balance}
.drawer h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stagebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:13px;text-align:left}
.stagebtn .cell::after{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:460px){.grid2,.stages{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink3)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:54px}
.know{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.know p{margin:0}
.know .k{font-size:12px;color:var(--ink3);display:block}
.know .num{font-size:12.5px}
.know .src{font-size:12px;color:var(--ink3)}
.me{font-weight:600;color:var(--accent)}
.note{background:var(--half-soft);color:var(--half-ink);border-radius:6px;padding:6px 8px;font-size:13px}
.note.bad{background:var(--warn-soft);color:var(--warn)}
.sugg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
.sugg span{flex:1 1 200px}
details>summary{cursor:pointer;font-size:13px;color:var(--ink2)}

/* toast + cheer */
.pieces{display:flex;flex-direction:column;gap:4px}
.venues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.venues li>div{margin-top:2px}
.piece{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:14px;padding:3px 0}
.piece input{width:18px;height:18px;margin:0}
.piece.done span{color:var(--ink3);text-decoration:line-through}
.piece .stg{font-size:11px;color:var(--ink3)}
.addpiece{display:flex;gap:6px}
.coach{font-size:12.5px;color:var(--ink3);min-height:17px}
.coach.bad{color:var(--half-ink)} .coach.good{color:var(--done-ink)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .clock{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;min-width:92px}
.timer .what{flex:1 1 220px;min-width:0;font-size:14px}
.timer .what small{display:block;font-size:12px;color:var(--ink3)}
.timer .bar{position:absolute;left:0;top:-1px;height:3px;background:var(--accent)}
.timer.brk .bar{background:var(--done)}
body.timing .wrap{padding-bottom:calc(var(--timer-h,120px) + 16px)}
body.timing .toast{bottom:calc(var(--timer-h,120px) + 10px)}
body.timing .drawer{padding-bottom:calc(var(--timer-h,120px) + 24px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:10px;font-size:14px;z-index:20;display:flex;gap:10px;align-items:flex-start;width:max-content;max-width:min(520px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast .msg{display:flex;flex-direction:column;gap:3px;padding-top:2px}
.toast .fact{font-weight:600}
.toast .cheer{opacity:.92;line-height:1.45}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:600;text-decoration:underline;padding:2px 6px;flex:none}
.toast button.close{text-decoration:none;opacity:.7}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .16s ease-out}@keyframes slide{from{transform:translateX(20px);opacity:.6}to{transform:none;opacity:1}}
  .toast{animation:rise .22s ease-out}@keyframes rise{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .cell.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
}
</style>

<div class="wrap">
  <div class="top"><h1>Paper Progress Tracker</h1><span class="meta" id="meta">Loading your papers…</span><button class="btn primary" id="quick25" style="margin-left:auto">▶ 25 min</button></div>
  <div id="groups"></div>
  <div class="foot">
    <span><i class="cell v1">✔</i>done</span><span><i class="cell v5">◐</i>partly</span><span><i class="cell hint"></i>your folders suggest this</span>
    <span>Tap a square to mark it. Tap a title for details.</span>
    <button class="linkbtn" id="addPaper">Add paper</button>
    <button class="linkbtn" id="toggleSettings">Default order and sources</button>
  </div>
  <div class="group" id="settingsBox" hidden><div class="ghead">Default order for papers you have not dragged yet</div><div class="settings" id="settings"></div></div>
</div>
<div id="drawerRoot"></div>
<div id="timerRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
const STAGES=[["Idea & RQs",5,1],["Literature",10,1],["Data",10,1],["Analysis",15,1],["Intro",5,2],["Method",5,2],["Results",10,2],["Discussion",10,2],["Abstract, refs, format",5,2],["Co-author sign-off",5,2],["Submitted",5,3],["Revision (R&R)",10,3],["Accepted",5,3]];
const SUB=10,REV=11,ACC=12;
const DEFAULTS={progress:40,d14:30,d30:22,d60:12,d120:6,selfMult:0.5,rr:25,venue:5,quick2:10,quick4:5,focusSlots:3,warmSlots:2,ignoredFolders:[]};
const SETTING_LABELS=[["progress","Points for a 100% paper"],["rr","Revising (R&R) bonus"],["d14","Deadline within 14 days"],["d30","Within 30 days"],["d60","Within 60 days"],["d120","Within 120 days"],["selfMult","Self-set deadline multiplier"],["venue","Points per venue level (1-3)"],["quick2","Quick win, 2 weeks or less"],["quick4","Quick win, 4 weeks or less"]];
/* Encouragement bank, keyed by stage. Filled from verified research, see ENC_SOURCES. */
const ENC={"Idea & RQs": ["Settling on questions you can actually answer is quiet work that rarely looks like progress from outside. It is progress, and everything else in this paper now has something to aim at.", "Turning a broad interest into focused questions means deciding what to leave out, and you made those calls. The reading ahead now has a filter.", "The first real piece of this paper exists where there was only an idea before. Every stage from here builds on what you just settled.", "With the questions set, the literature has a clear brief. When you next open this paper, you could note the few sources each question cannot do without."], "Literature": ["The reading is done and the gap this paper speaks to is written down. That is some of the slowest groundwork in research, and it is behind you.", "Sorting which studies matter and how they speak to each other is thinking, not only reading. The stages ahead get to stand on that work.", "Breaking a paper into stages is what lets a day like this count. The literature is mapped, and the data stage now knows what it needs to capture.", "Literature work rarely moves in tidy daily steps, and whatever rhythm got it done worked. The map of what is already known is finished, and that is worth feeling good about."], "Data": ["Data depend on consent, access and other people's calendars, and all of that is now behind this paper. It rests on something real.", "This dataset exists because participants and colleagues gave their time. A quiet word of thanks to them is a lovely way to mark the day.", "The dataset is ready and the analysis has material to work with. A short first session is plenty, simply opening the file and checking the variables look as expected.", "Questions, reading and now data are in place, so the foundation of this study is laid. The analysis gets to start from solid ground."], "Analysis": ["The analysis is where all the preparation turns into answers. You now know what this study found, and every section still to come draws on exactly that.", "Analysis means many small choices about models, checks and what counts as a finding, and you worked through them. This paper has results to report.", "Analysis rarely runs in a straight line, with reruns and dead ends along the way. Reaching stable results is what matters, and you are there.", "With findings in hand, the writing has its raw material. Next session, you could write the main results as plain sentences before touching any section."], "Intro": ["The introduction now makes the case for why this study matters, the question every reader brings. The whole argument has its frame.", "Framing a problem so a busy reader cares usually means redrafting the same few paragraphs. You made the choices about what to put first, and they are on the page.", "A good share of this paper now exists in draft, and the introduction gives it a front door. That is a lot of work already standing.", "Introductions often take several passes, and this one is done for now. The method comes next, and it can start with a brief sitting."], "Method": ["Sample, measures and procedure are now written in a form a reviewer can check. Anyone who wants to know how this study was done can find out.", "Method writing is exacting, getting every step precise enough for someone else to follow. That careful, unglamorous work is done.", "With the method written, this paper turns a corner. Most of what remains is about what you found and what it means.", "The method is done, and it is the kind of section that quietly holds a whole paper up. The first results table would make a tidy target for the next sitting, and a fine place to stop."], "Results": ["The findings are now laid out in tables and text that others can examine. That is what every other section points to.", "The core evidence of this paper is now written. The stretch still ahead is mostly interpretation and finishing.", "Turning output into clear tables and plain sentences is slow, careful work. It is done, and the Discussion now has something concrete to explain.", "When you next open this paper, you could list the findings the Discussion has to explain, and stop there. That list is the skeleton of the section."], "Discussion": ["The Discussion is where this study says what it adds, and that argument now exists. It is the section that turns results into a contribution.", "Placing your findings against the literature and naming the limits honestly takes judgment. That thinking is now on the page.", "The heaviest writing on this paper is behind you. What remains is the abstract, the details and any co-author read.", "If the abstract is next, lifting a key sentence from each section gives you a quick rough version. It is a small task with a clear edge."], "Abstract, refs, format": ["The fiddly finishing work is done, the kind nobody notices unless it is missing. This draft now looks like something a journal can receive.", "Only co-author sign-off and the submission itself remain. Most of the distance is already covered.", "The manuscript is ready to share. A short note to your co-authors with a reply-by date is a good next step.", "Detail work like this drains attention more than it shows. A good coffee or a short walk is a fair way to mark it."], "Co-author sign-off": ["Bringing several people to agree on the same version takes patience and tact, and it is done. This paper now has the whole team behind it.", "Chasing replies, merging tracked changes and settling disagreements rarely gets credit, yet joint papers depend on it. That work is done.", "With everyone on board, only the submission itself is left. This paper is about to leave your desk.", "When you next open this paper, you could draft the cover letter from the abstract and the journal's aims. It is a short job that clears the way to submit."], "Submitted": ["Submitting takes a finished argument, checked references and the nerve to let it go. This one deserves a real celebration, with your co-authors if you can!", "A quiet day after a big send is normal. Picking a small task on your next paper gives you an easy place to start again.", "Selective journals turn down most of what they receive, so whatever comes back is not a ruling on this study. Finishing and sending it was the part in your control, and that is done.", "This submission carries the work of everyone who read, argued and signed off. Letting them know it is out is a kind way to close this stage."], "R&R back": ["Reviews like these sting for nearly everyone who sends work out, and it is fine to let them sting for an evening. Tomorrow, the comment you can answer fastest is a good place to start.", "An R&R keeps this paper in play at the journal. A journal manager reports that most papers sent back for major revision at her journals were later accepted, though nothing is guaranteed.", "Hard reviews are a routine part of publishing, and they often feel lighter once each point has an answer. None of it is a verdict on whether you belong in this field.", "Much-published authors get plenty of revision requests too, and what often sets them apart is that they keep going. Answering these comments is how this paper keeps going too."], "Resubmitted": ["Working through the reviewer comments and writing the response letter is among the most careful writing in research. It is finished and back with the editor.", "Revision asks you to reopen work you thought was finished, and you did it. Staying with a paper through revision is often what gets it into print.", "The paper is out of your hands again, and the waiting is the editor's job now. The next session can go to whichever paper is closest to its own next stage.", "Sending a revision back is a milestone worth marking, and worth sharing with anyone who helped. Whatever the editor decides, this round is finished."], "Accepted": ["This is the one to celebrate out loud, with everyone who helped along the way! When the proofs arrive, a careful pass will close it out.", "The question this paper started with now has an answer others can read and build on. Every earlier stage was building toward this.", "This acceptance rests on carrying the paper through every stage, including the slow and difficult ones. The next paper in your queue can draw on that same persistence.", "Celebrate fully. Then, before the week ends, jotting down the smallest next task on another paper gives this energy somewhere to go."], "Partly done": ["Part of a stage is real movement. Papers get finished through steps this size.", "Getting back into a stage and moving it forward is often the hardest part, and it happened. What is already drafted is the place to pick up, not a fresh page.", "Before closing the file, you could jot down where you stopped and the next small step. Next time, that line is where you begin.", "This paper moved while other work also needed you. Partial progress alongside other demands is still progress, and it counts."]};
const ENC_SOURCES=[{"id": "p1", "principle": "Progress in meaningful work, even a small step, is the strongest everyday lift to motivation, and setbacks weigh more than equivalent wins. Recognition helps less and needs real progress to attach to. The data are correlational diaries from corporate knowledge workers, so applying them to paper stages is an extrapolation.", "citation": "Amabile, T. M., & Kramer, S. J. (2011). The power of small wins. Harvard Business Review, 89(5), 70-80 (reprint R1105C).", "url": "https://hbr.org/2011/05/the-power-of-small-wins"}, {"id": "p2", "principle": "Frame progress by whichever side is smaller. Early stages count what is done, later stages point to what is left. Effort resets lower right after a reward is earned, so name the next small step in the same message. The studies are consumer and lab settings, not manuscripts.", "citation": "Kivetz, R., Urminsky, O., & Zheng, Y. (2006). The goal-gradient hypothesis resurrected: Purchase acceleration, illusionary goal progress, and customer retention. Journal of Marketing Research, 43(1), 39-58. Koo, M., & Fishbach, A. (2012). The small-area hypothesis: Effects of progress monitoring on goal adherence. Journal of Consumer Research, 39(3), 493-509. Koo, M., & Fishbach, A. (2008). Dynamics of self-regulation: How (un)accomplished goal actions affect motivation. Journal of Personality and Social Psychology, 94(2), 183-195.", "url": "https://doi.org/10.1086/663827"}, {"id": "p3", "principle": "Goals work best with summary feedback showing progress against the goal, and a distant goal works better broken into proximal subgoals. The 13 stages are that breakdown. The subgoal evidence Locke and Latham cite is about complex tasks, mainly one business-game study.", "citation": "Locke, E. A., & Latham, G. P. (2002). Building a practically useful theory of goal setting and task motivation: A 35-year odyssey. American Psychologist, 57(9), 705-717. https://doi.org/10.1037/0003-066X.57.9.705", "url": "https://med.stanford.edu/content/dam/sm/s-spire/documents/PD.locke-and-latham-retrospective_Paper.pdf"}, {"id": "p4", "principle": "Close with one concrete if-then plan for the next small step (implementation intention), offered as a suggestion the writer can ignore.", "citation": "Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. Advances in Experimental Social Psychology, 38, 69-119. https://doi.org/10.1016/S0065-2601(06)38002-1", "url": "https://kops.uni-konstanz.de/handle/123456789/10973"}, {"id": "p5", "principle": "Acknowledge the work and the specific choices made (process), not traits or talent. The child praise result is contested (Li and Bates did not replicate the motivation effects), while the adult feedback meta-analysis points the same way (feedback that pulls attention to the self is less effective).", "citation": "Mueller, C. M., & Dweck, C. S. (1998). Praise for intelligence can undermine children's motivation and performance. Journal of Personality and Social Psychology, 75(1), 33-52. Kluger, A. N., & DeNisi, A. (1996). The effects of feedback interventions on performance: A historical review, a meta-analysis, and a preliminary feedback intervention theory. Psychological Bulletin, 119(2), 254-284. Li, Y., & Bates, T. C. (2019). You can't change your basic ability, but you work at things, and that's how we get hard things done: Testing the role of growth mindset on response to setbacks, educational attainment, and cognitive ability. Journal of Experimental Psychology: General, 148(9), 1640-1655. Yeager, D. S., & Dweck, C. S. (2020). What can be learned from growth mindset controversies? American Psychologist, 75(9), 1269-1284.", "url": "https://doi.org/10.1037/0022-3514.75.1.33"}, {"id": "p6", "principle": "Positive feedback raises intrinsic motivation, more for college students than children, when it informs about competence rather than pressures. Wording such as should, must or keep up the good work made praise controlling and undermining in the studies. That contrast rests on four small experiments.", "citation": "Deci, E. L., Koestner, R., & Ryan, R. M. (1999). A meta-analytic review of experiments examining the effects of extrinsic rewards on intrinsic motivation. Psychological Bulletin, 125(6), 627-668. Henderlong, J., & Lepper, M. R. (2002). The effects of praise on children's intrinsic motivation: A review and synthesis. Psychological Bulletin, 128(5), 774-795.", "url": "https://doi.org/10.1037/0033-2909.125.6.627"}, {"id": "p7", "principle": "Praise only works if believed, so keep it specific, earned and proportionate to the stage. The review is about children, and the authors call this part largely speculative (opinion, not tested).", "citation": "Henderlong, J., & Lepper, M. R. (2002). The effects of praise on children's intrinsic motivation: A review and synthesis. Psychological Bulletin, 128(5), 774-795.", "url": "https://www.reed.edu/psychology/motivation/assets/downloads/Henderlong_Lepper_2002.pdf"}, {"id": "p8", "principle": "After a setback, offer self-compassion (name the feeling, note it is shared, one kind next step) rather than self-esteem boosting.", "citation": "Breines, J. G., & Chen, S. (2012). Self-compassion increases self-improvement motivation. Personality and Social Psychology Bulletin, 38(9), 1133-1143, doi:10.1177/0146167212445599. Neff, K. D., Hsieh, Y.-P., & Dejitterat, K. (2005). Self-compassion, achievement goals, and coping with academic failure. Self and Identity, 4, 263-287, doi:10.1080/13576500444000317.", "url": "https://doi.org/10.1177/0146167212445599"}, {"id": "p9", "principle": "Point to the next short session, not a marathon. Boice's samples were small groups of volunteer, self-identified procrastinators on local campuses and were never replicated (Sword 2016), so treat this as suggestive.", "citation": "Boice, R. (1997). Which is more productive, writing in binge patterns of creative riting), and save a real celebration for milestones such as submission and acceptance (Belcher closes her submission week with send and celebrate). Expert advice, not tested experimentally.", "citation": "Silvia, P. J. (2007/2018). How to write a lot. APA, as summarized in Barnhill, G. (2020, June 30). Book review: How to write a lot by Paul J. Silvia. Baylor Graduate Writing Center blog. Belcher, W. L. (2019). Writing your journal article in twelve weeks (2nd ed.). University of Chicago Press.", "url": "https://blogs.baylor.edu/gwc/2020/06/30/book-review-how-to-write-a-lot-by-paul-j-silvia/"}, {"id": "p13", "principle": "Rejection and R&R are the normal cost of publishing, and persistence rather than worthiness is often what separates much-published authors from unpublished ones. Expert argument, not trials.", "citation": "Belcher, W. L. (2012, Nov 13). Successful academic writers persist despite rejection. PhD2Published (excerpt from Writing your journal article in twelve weeks). Silvia, P. J. (2007). How to write a lot, pp. 100-101, as reported in Dearing, R. L. (2007), PsycCRITIQUES 52(27). doi:10.1037/a0008247", "url": "https://www.phd2published.com/2012/11/13/successful-academic-writers-persist-despite-rejection-wendy-laura-belcher/"}, {"id": "p14", "principle": "To restart a stalled stage, forgive the delay without mentioning it, and pick up from existing notes or drafts rather than a blank page. Correlational data from first-year students plus expert practice.", "citation": "Wohl, M. J. A., Pychyl, T. A., & Bennett, S. H. (2010). I forgive myself, now I can study: How self-forgiveness for procrastinating can reduce future procrastination. Personality and Individual Differences, 48(7), 803-808. Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. Advances in Experimental Social Psychology, 38, 69-119. Belcher (2019), Introduction.", "url": "https://dn790006.ca.archive.org/0/items/affective-cognitive-and-behavioral-differences-bet/I_forgive_myself_now_I_can_study_How_sel.pdf"}, {"id": "p15", "principle": "Selective journals reject most submissions (APA journals averaged a 70% rejection rate in 2023, and the global average acceptance rate is estimated at about 35-40%), so a no is the ordinary outcome and not a ruling on the study. In one large survey of biology journals, roughly a quarter of published articles had first been submitted to another journal.", "citation": "American Psychological Association (2024). Summary report of journal operations, 2023. American Psychologist, 79(5), 777-778, doi:10.1037/amp0001383. Björk, B.-C. (2019). Acceptance rates of scholarly peer-reviewed journals: A literature survey. El Profesional de la Información, 28(4), e280407, doi:10.3145/epi.2019.jul.07. Calcagno, V., Demoinet, E., Gollner, K., Guidi, L., Ruths, D., & de Mazancourt, C. (2012). Flows of research manuscripts among scientific journals reveal hidden submission patterns. Science, 338(6110), 1065-1069.", "url": "https://www.apa.org/pubs/journals/features/2023-statistics.pdf"}, {"id": "p16", "principle": "Frame a setback as common and temporary, and as no evidence that the writer does not belong in the field. Undergraduate samples, so applying it to peer review is an inference.", "citation": "Walton, G. M., & Cohen, G. L. (2011). A brief social-belonging intervention improves academic and health outcomes of minority students. Science, 331(6023), 1447-1451. Walton, G. M., Murphy, M. C., Logel, C., Yeager, D. S., Goyer, J. P., Brady, S. T., et al. (2023). Where and with whom does a brief social-belonging intervention promote progress in college? Science, 380(6644), 499-505.", "url": "https://doi.org/10.1126/science.1198364"}, {"id": "p17", "principle": "Treat an R&R as a strong forward step, honestly and without a guarantee. The source is one publishing executive's figure (80-90%) for major-revision papers at journals she has managed, which she does not function score(p){

  if(t.dataset.setting){const v=Number(t.value);if(t.value!==""&&!isNaN(v))saveSettings(t.dataset.setting,v)}});
let pendingList=null;
document.addEventListener("change",async e=>{if(e.target&&e.target.id==="jfile"&&e.target.files&&e.target.files[0]){const f=e.target.files[0],box=$("#jconfirm");box.textContent="Reading the file…";
    try{const L=await readJournalFile(f);if(L.titles.length<50)throw new Error("few");pendingList=L;
      box.innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px">Replace the ${esc(S.journals?S.journals.year:"")} list (${S.journals&&S.journals.titles?S.journals.titles.length:0}) with ${esc(L.year)} (${L.titles.length} journals)? The old list is kept. <button class="btn primary" data-jreplace>Replace</button><button class="btn" data-jcancel>Cancel</button></div>`}
    catch(err){box.textContent=S.local&&!window.XLSX?"Excel files can only be read in the online version. Use a .csv file here, or replace the list online.":"Could not read a journal list from that file. It needs a column named Journal Title."}}});
document.addEventListener("change",e=>{const t=e.target,p=S.papers[S.open];
  if(t.dataset.fb&&p){writePaper(p.id,{[t.dataset.fb]:t.checked,confirmed:true,updatedAt:new Date().toISOString()});if(t.dataset.fb==="onlineCollab")setTimeout(renderDrawer,0)}});

/* ---------- offline copy on this Mac: a local store with the same calls the page uses ---------- */
function localDB(){const api="/api";const kick=new Set();
  const q=s=>encodeURIComponent(s);
  async function jget(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw{code:"unavailable"};return r.json()}
  async function write(c,id,op,data){const r=await fetch(`${api}/d/${q(c)}/${q(id)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op,data:data||null})});
    if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw{code:e.code||"unavailable"}}kick.forEach(f=>f())}
  const snapDoc=(id,d)=>({id,exists:!!d.exists,data:()=>d.data||undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  function watch(run){run();const t=setInterval(run,4000);kick.add(run);return()=>{clearInterval(t);kick.delete(run)}}
  const doc=(c,id)=>({id,path:c+"/"+id,get:async()=>snapDoc(id,await jget(`${api}/d/${q(c)}/${q(id)}`)),set:d=>write(c,id,"set",d),update:d=>write(c,id,"update",d),delete:()=>write(c,id,"delete"),
    onSnapshot(next){let last=null;return watch(async()=>{try{const d=await jget(`${api}/d/${q(c)}/${q(id)}`),k=JSON.stringify(d);if(k!==last){last=k;next(snapDoc(id,d))}}catch(e){}})}});
  return{doc(path){const i=path.indexOf("/");return doc(path.slice(0,i),path.slice(i+1))},
    collection(c){return{doc:id=>doc(c,id),onSnapshot(next){let last=null;return watch(async()=>{try{const r=await jget(`${api}/c/${q(c)}`),k=JSON.stringify(r.docs);if(k!==last){last=k;next({docs:r.docs.map(d=>snapDoc(d.id,{exists:true,data:d.data})),size:r.docs.length,empty:!r.docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]})}}catch(e){}})}}}}}

async function finderCall(what,body){try{const r=await fetch("/api/"+what,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return await r.json()}catch(e){return null}}

/* ---------- boot ---------- */
loadT();render();renderTimer();
(async()=>{try{const sm=await(window.claude&&window.claude.use?window.claude.use("sample"):null);if(sm){S.sample=sm;if(S.open)renderDrawer()}}catch(e){}})();
(async()=>{
  let db=await(window.claude&&window.claude.use?window.claude.use("db"):Promise.resolve(null));
  if(!db&&/^(127\.0\.0\.1|localhost)$/.test(location.hostname)){db=localDB();S.local=true;try{S.cfg=await (await fetch("/api/config",{cache:"no-store"})).json()}catch(e){S.cfg={}}}
  if(!db){render();return}
  S.db=db;render();
  db.collection("papers").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});
    Object.keys(pending).forEach(k=>{if(m[k])Object.assign(m[k],pending[k])});
    S.papers=m;S.loaded=true;render()},()=>toast("Lost connection to your papers, reload the page"));
  db.collection("scan").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(d.id==="_run")S.run=v;else if(d.id==="_new")S.newFolders=Array.isArray(v.folders)?v.folders:[];else m[d.id]=v});S.scans=m;render()},()=>{});
  db.collection("plan").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});
    Object.keys(S.plans).forEach(k=>{if(timers["pl_"+k]&&S.plans[k])m[k]=S.plans[k]});S.plans=m;render();if(T)renderTimer()},()=>{});
  watchFocus();
  db.doc("journals/list").onSnapshot(d=>{S.journals=d.exists?d.data():null;if(!$("#settingsBox").hidden&&!pendingList)renderSettings();if(S.open)renderDrawer()},()=>{});
  db.collection("venues").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.venues=m;if(S.open)renderDrawer()},()=>{});
  db.collection("context").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.ctx=m;render()},()=>{});
  db.doc("config/settings").onSnapshot(d=>{if(d.exists){S.settings={...DEFAULTS,...d.data()};const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.setting)&&!$("#settingsBox").hidden)renderSettings();render()}},()=>{});
})();
</script>
