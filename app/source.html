<title>Paper Progress Tracker</title>
<style>
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#E9EDEF; --line:#D5DCE0; --ink:#15202B; --ink2:#4A5763; --ink3:#5E6B76;
  --accent:#2446C7; --accent-soft:#E3E9FB; --on-accent:#fff;
  --done:#2A8554; --done-soft:#D5EEDF; --done-ink:#1E6B41; --on-done:#fff;
  --half:#C98A0C; --half-soft:#FBEBC6; --half-ink:#7F5300;
  --warn:#B4432F; --warn-soft:#F8DDD6;
  --p1:#9FB3EC; --p2:#8CCBA5; --p3:#E9AE86;
  --g1:#9FB3EC; --g2:#7FB8D6; --g3:#8CCBA5; --g4:#C8B3E8; --g5:#D9C38A; --g6:#E9AE86; --g7:#E7A6BE;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --surface:#172029; --sunk:#1E2A34; --line:#2C3A46; --ink:#E6ECF0; --ink2:#A9B6C0; --ink3:#8795A0;
    --accent:#8AA4FF; --accent-soft:#1F2B55; --on-accent:#0F151B;
    --done:#5CC48A; --done-soft:#1C3A2A; --done-ink:#8EE0B0; --on-done:#0F151B;
    --half:#E7B24A; --half-soft:#3F3217; --half-ink:#F2CB7A;
    --warn:#F08A74; --warn-soft:#44221B;
    --p1:#4A5E9E; --p2:#3F7D58; --p3:#9A6445;
    --g1:#4A5E9E; --g2:#3F6F8C; --g3:#3F7D58; --g4:#6A5A93; --g5:#7F6F3F; --g6:#9A6445; --g7:#94506B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --surface:#172029; --sunk:#1E2A34; --line:#2C3A46; --ink:#E6ECF0; --ink2:#A9B6C0; --ink3:#8795A0;
  --accent:#8AA4FF; --accent-soft:#1F2B55; --on-accent:#0F151B;
  --done:#5CC48A; --done-soft:#1C3A2A; --done-ink:#8EE0B0; --on-done:#0F151B;
  --half:#E7B24A; --half-soft:#3F3217; --half-ink:#F2CB7A;
  --warn:#F08A74; --warn-soft:#44221B;
  --p1:#4A5E9E; --p2:#3F7D58; --p3:#9A6445;
  --g1:#4A5E9E; --g2:#3F6F8C; --g3:#3F7D58; --g4:#6A5A93; --g5:#7F6F3F; --g6:#9A6445; --g7:#94506B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-size:20px;margin:0}
.top .meta{font-size:13px;color:var(--ink3)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);background:var(--sunk);font-weight:600;border-radius:8px 8px 0 0}
.ghead .phases{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 8px;font-size:10px;letter-spacing:.05em;text-transform:none}
.ghead .phases span{white-space:nowrap}.ghead .phases .alt{margin-left:-5px}
.ghead .phases i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.sub{padding:5px 12px 3px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);border-top:1px solid var(--line)}

/* wide row: the first two columns have a set width, so the squares start at the same place in every row. The next step takes the room that is left */
.line{display:grid;grid-template-columns:28px 200px auto 38px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line)}
.ghead+.line,.sub+.line{border-top:none}
.mark{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--ink3)}
.grip{border:0;background:none;padding:2px 1px;color:var(--ink3);font-size:15px;line-height:1;cursor:grab;touch-action:none;border-radius:4px}
.grip:hover{color:var(--accent);background:var(--accent-soft)}
.group.focusblk{border:2px solid var(--accent)}
.group.focusblk .ghead{background:var(--accent-soft);color:var(--accent)}
.zone{min-height:6px}
body.dragging-now .zone{min-height:44px}
@media (pointer:coarse){.grip{min-width:36px;min-height:36px;font-size:20px;-webkit-touch-callout:none;-webkit-user-select:none}}
.zhint{padding:8px 12px;font-size:13px;color:var(--ink3);border-top:1px dashed var(--line)}
.line.dragging{position:fixed;z-index:30;background:var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.2);border:1px solid var(--accent);border-radius:8px;pointer-events:none;opacity:.96}
.ph{margin:4px 10px;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:8px}
body.dragging-now{user-select:none;cursor:grabbing}
.mark i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3);flex:none}
.mark.focus i{background:var(--accent);border-color:var(--accent)} .mark.focus{color:var(--accent);font-weight:600}
.mark.warm i{border-color:var(--accent)}
.tcell{min-width:0;display:flex;flex-direction:column;gap:1px}
.trow{display:flex;align-items:center;gap:6px;min-width:0}
.ttl{border:0;background:none;padding:0;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ttl:hover{text-decoration:underline;text-decoration-color:var(--ink3)}
.role{flex:none;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap}
.role.main{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.role.unsure{border-style:dashed}
.role:hover{border-color:var(--ink3)}
.folder{font-family:var(--mono);font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;max-width:100%;cursor:pointer}
.folder::before{content:"";display:inline-block;width:11px;height:8px;margin-right:5px;border:1.5px solid currentColor;border-radius:1px 2px 2px 2px;vertical-align:-1px}
.folder:hover{color:var(--accent);text-decoration:underline}
.folderbtns{display:flex;gap:6px;flex-wrap:wrap}
.where{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;row-gap:4px}
.where .folder{flex:0 1 auto;min-width:0}
.lnk{flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--accent);text-decoration:none;white-space:nowrap;cursor:pointer}
.lnk:hover{border-color:var(--accent)}
.links{display:flex;flex-direction:column;gap:4px}
.linkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.linkrow .u{font-family:var(--mono);font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a file or folder on this computer: its name and buttons, then where it is. A long path shows its end, the folder and the file */
.lnk.loc{color:var(--ink2);border-style:dashed}.lnk.off{cursor:default}.lnk.off:hover{border-color:var(--line)}
.linkrow.loc{grid-template-columns:minmax(0,1fr) auto;row-gap:3px}.linkrow.loc>.lnk{justify-self:start}.linkrow .lacts{display:flex;gap:4px;align-items:center}
.linkrow.loc .u{grid-column:1 / -1;display:flex;align-items:center;gap:6px}.linkrow .gone{grid-column:1 / -1;font-size:12.5px}
.linkrow .here{flex:none;font-family:var(--body);font-size:11px;line-height:1;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.linkrow .why{flex:none;font-family:var(--body);font-size:12px}
.linkrow .pth{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.addlink{flex-wrap:wrap}.addlink input{flex:1 1 200px;min-width:0}
.folder.bad{color:var(--warn)}
.strip{display:flex;gap:2px;align-items:center}
.strip .gap{width:5px;flex:none}
/* squares whose outline is not sure yet are dimmed, but only when that lasts longer than a moment, so a normal load does not flicker */
.strip.wait{animation:olwait 0s .6s forwards}@keyframes olwait{to{opacity:.5}}
.cell{width:22px;height:20px;border-radius:4px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-size:9.5px;font-weight:600;letter-spacing:-.02em;padding:0;color:var(--ink3);position:relative;flex:none;line-height:1}
.cell::after{content:"";position:absolute;left:3px;right:3px;bottom:-4px;height:2px;border-radius:1px;background:var(--pc)}
.cell.p1{--pc:var(--p1)} .cell.p2{--pc:var(--p2)} .cell.p3{--pc:var(--p3)}
.cell.g1{--pc:var(--g1)} .cell.g2{--pc:var(--g2)} .cell.g3{--pc:var(--g3)} .cell.g4{--pc:var(--g4)} .cell.g5{--pc:var(--g5)} .cell.g6{--pc:var(--g6)} .cell.g7{--pc:var(--g7)}
.cell.v1{background:var(--done);border-color:var(--done);color:var(--on-done)}
.cell.v5{background:var(--half-soft);border-color:var(--half);color:var(--half-ink)}
.cell.hint{box-shadow:0 0 0 2px var(--half)}
.pct{font-size:13px;color:var(--ink2);text-align:right}
.now{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.go{display:flex;align-items:center;gap:6px;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 8px 3px 4px;font-size:13px;text-align:left}
.go:hover{border-color:var(--accent)}
.go:focus-visible{outline-offset:-2px}
.go i{flex:none;font-style:normal;font-size:11px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:2px 5px}
.go span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go.on{border-color:var(--accent);background:var(--accent-soft)}
.now b{color:var(--ink);font-weight:500}
.now .late{color:var(--warn)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.ok{border-color:var(--done);color:var(--done-ink);font-weight:600}
.btn.ok:hover{background:var(--done-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.x{padding:4px 8px;color:var(--ink3)}
.empty{padding:14px 12px;color:var(--ink3);font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink3)}
.foot .cell{display:inline-grid;width:14px;height:14px;font-size:9px;vertical-align:-2px;margin-right:3px}
.foot .cell::after{display:none}
.foot .cell{width:auto;min-width:18px;padding:0 3px}
.sqkey{flex-basis:100%}
.sqkey>summary{cursor:pointer;color:var(--accent)}
.sqkey .ol{margin:6px 0 2px;font-size:12.5px;color:var(--ink2)}
.sqkey .ol b{color:var(--ink);font-weight:600}
.sqkey .ol span{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}
.sqkey .ol code{font-family:var(--mono);font-size:11px;background:var(--sunk);border-radius:3px;padding:0 3px;margin-right:3px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.newf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding:8px 12px;border-top:1px solid var(--line)}
.newf:first-child{border-top:none}
.newf code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:4px;word-break:break-all}
details.arch>summary{list-style:none;cursor:pointer}
details.arch>summary::-webkit-details-marker{display:none}
details.arch:not([open])>summary{border-radius:8px}
.archrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);font-size:14px}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:10px 12px}
.aiset{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.aiset .aiprov{display:flex;flex-wrap:wrap;gap:4px 16px}.aiset input[type=radio]{width:auto;margin:0}
.aiset .aif{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.aiset .aibtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.aiset p{margin:0;font-size:12.5px}.aiset>.src{font-size:13px;color:var(--ink2)}.aimsg{font-size:13px;min-height:17px;color:var(--ink2)}.aimsg.good{color:var(--done-ink)}.aimsg.bad{color:var(--warn)}
#breakMsg{font-size:12.5px;color:var(--ink3)}#breakMsg.bad{color:var(--warn)}

/* rows have up to 20 squares, so the compact row is used up to 1100 px, where the wide row would scroll sideways */
@media (max-width:1100px){
  .line{grid-template-columns:22px minmax(0,1fr) auto auto;row-gap:6px;padding:8px 10px}
  .line .mark{grid-column:1;grid-row:1 / span 3;align-self:start}
  .line .mark .num{display:none}
  .line .tcell{grid-column:2;grid-row:1}
  .line .pct{grid-column:3;grid-row:1}
  .line .acts{grid-column:4;grid-row:1}
  .line .strip{grid-column:2 / -1;grid-row:2}
  .line .strip .cell{flex:1 1 0;min-width:0;width:auto;height:28px}
  .line .now{grid-column:2 / -1;grid-row:3}
  .line .now.plain{display:none}
  /* the Focus block's thicker border is taken from its padding, so its squares are as wide as the ones below */
  .group.focusblk .line{padding-inline:9px}
}
/* the colour key fits the header down to 901 px */
@media (max-width:900px){.ghead .phases{display:none}}
@media (pointer:coarse) and (max-width:1100px){.line{grid-template-columns:36px minmax(0,1fr) auto auto}}
/* wide rows: the Focus block has a thicker border, so its rows are padded 1 px less and the squares line up with the rows below. A touch screen has a wider grip, so the rank needs a wider first column. The title gives that room back, so the squares start where they do with a mouse and the next step keeps its room */
@media (min-width:1101px){.group.focusblk .line{padding-inline:11px}.ttl{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;line-height:1.25;overflow-wrap:anywhere}}
@media (pointer:coarse) and (min-width:1101px){.line{grid-template-columns:56px 172px auto 38px minmax(0,1fr) auto}}
/* narrow screens: the squares break onto two rows at one group gap (data-brk), so each square stays wide enough to tap */
@media (max-width:660px){
  .line .strip{flex-wrap:wrap;row-gap:5px}
  .line .strip .gap[data-brk]{flex:0 0 100%;width:auto;height:0}
  .line .strip .cell{height:30px;max-width:44px}
}
/* phones: the title has the whole first row but the percentage, the squares use the full width, the next step and the milestone button share the last row */
@media (max-width:560px){
  .line{grid-template-columns:24px minmax(0,1fr) auto 36px}
  .line .mark{grid-row:1}
  .line .tcell{grid-column:2 / 4;grid-row:1}
  .line .pct{grid-column:4;grid-row:1}
  .line .strip{grid-column:1 / -1;grid-row:2}
  .line .now{grid-column:1 / 3;grid-row:3}
  .line .acts{grid-column:3 / -1;grid-row:3}
  .trow{flex-wrap:wrap;row-gap:2px}
}
@media (pointer:coarse) and (max-width:560px){.line{grid-template-columns:36px minmax(0,1fr) auto 36px}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:10}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:11;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.drawer:focus,.timer:focus,#groups:focus{outline:none}
.drawer header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer h2{font-family:var(--display);font-size:18px;margin:0;text-wrap:balance}
.drawer h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.stages{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stagebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:13px;text-align:left}
.stagebtn .cell::after{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:460px){.grid2,.stages{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink3)}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:54px}
.know{font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.know p{margin:0}
.know .k{font-size:12px;color:var(--ink3);display:block}
.know .num{font-size:12.5px;overflow-wrap:anywhere}
.know .src{font-size:12px;color:var(--ink3)}
.me{font-weight:600;color:var(--accent)}
.note{background:var(--half-soft);color:var(--half-ink);border-radius:6px;padding:6px 8px;font-size:13px}
.note.bad{background:var(--warn-soft);color:var(--warn)}
.sugg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
.sugg span{flex:1 1 200px}
details>summary{cursor:pointer;font-size:13px;color:var(--ink2)}

/* toast + cheer */
.pickup{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 2px;border-top:1px dashed var(--line);margin-top:2px}
.pickup label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600;flex:none}
.pickup input{flex:1 1 260px;min-width:0;font-size:14px;background:var(--surface);border-color:var(--line)}
.pickup .src{font-size:12px;color:var(--ink3)}
.pkl{font-style:normal;color:var(--ink3)}.go.on .pkl{color:var(--ink2)}
.pieces{display:flex;flex-direction:column;gap:4px}
.routine summary{cursor:pointer;font-size:13.5px;font-weight:600}
.routine .rnote{font-size:12.5px;color:var(--ink3);margin:6px 0}.routine .rhint{font-size:13.5px;margin:6px 0}
.routine .rpick{flex-direction:row;align-items:center;gap:6px;margin-top:8px}.routine .rpick select{max-width:100%;flex:1;min-width:0}
.rsteps{display:flex;flex-direction:column;gap:4px}
.rstep{display:flex;align-items:center;gap:8px;font-size:13.5px}.rstep>span:first-child{flex:1;min-width:0}.rstep .btn{flex:none}
.promise{flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;background:var(--half-soft);color:var(--half-ink);white-space:nowrap}
.tp h3{margin:0}
.tp .wk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tp .wk b{font-family:var(--display);font-size:16px}
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.barrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.barrow.other .tr i{background:var(--ink3)}
.barrow .mv{grid-column:1 / -1;font-size:12px;color:var(--ink3);margin-top:-3px}
.kpis{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.kpis b{font-family:var(--mono);font-size:15px;color:var(--ink)}

function outlineOf(p){if(p.outline&&OUTLINES[p.outline])return p.outline;if(p.type==="Editorial")return"editorial";if(p.type==="Chapter")return"conceptual";if(p.type==="Grant"||/\bgrant\b/i.test(p.title||""))return"grant";

  if(n01(a[10])===1&&!["Su","Rv","Ac"].includes(k))return 1;let v=0;LEGACY.forEach((_,j)=>{if(legKeys(p,j).includes(k))v=Math.max(v,n01(a[j]))});return v}

  const old=Array.isArray(p.stages)?p.stages.slice(0,13):[];const leg=LEGACY.map((_,j)=>{const ks=legKeys(p,j);if(!ks.length||ks.every(k=>val(k)===stVal(p,k)))return n01(old[j]);const vs=ks.map(val);return vs.every(x=>x===1)?1:vs.some(x=>x>0)?0.5:0});

  idea:{h:"Aim to leave this piece with one plain contribution sentence and the reporting guideline chosen.",s:[["Write the one-sentence contribution and the RQs it answers","p10"],["Pick the reporting guideline (JARS-Quant, JARS-Qual, JARS-Mixed, PRISMA 2020 or none)","p8"],["Tag each hypothesis or RQ as primary, secondary or exploratory","p8"],["Name the target journal and 3 scholars who would likely review it","p10","!grant"],["Start the alignment matrix, one row per RQ (gap, RQ, method, result, conclusion)","p10"],["Create the project scaffold (doc, data, results, scripts, README, CHANGELOG)","p11"],["Agree one manuscript workflow and tool with all co-authors in writing","p11"]]},

const ENC={"Idea & RQs": ["Settling on questions you can actually answer is quiet work that rarely looks like progress from outside. It is progress, and everything else in this paper now has something to aim at.", "Turning a broad interest into focused questions means deciding what to leave out, and you made those calls. The reading ahead now has a filter.", "The first real piece of this paper exists where there was only an idea before. Every stage from here builds on what you just settled.", "With the questions set, the literature has a clear brief. When you next open this paper, you could note the few sources each question cannot do without."], "Literature": ["The reading is done and the gap this paper speaks to is written down. That is some of the slowest groundwork in research, and it is behind you.", "Sorting which studies matter and how they speak to each other is thinking, not only reading. The stages ahead get to stand on that work.", "Breaking a paper into stages is what lets a day like this count. The literature is mapped, and the data stage now knows what it needs to capture.", "Literature work rarely moves in tidy daily steps, and whatever rhythm got it done worked. The map of what is already known is finished, and that is worth feeling good about."], "Data": ["Data depend on consent, access and other people's calendars, and all of that is now behind this paper. It rests on something real.", "This dataset exists because participants and colleagues gave their time. A quiet word of thanks to them is a lovely way to mark the day.", "The dataset is ready and the analysis has material to work with. A short first session is plenty, simply opening the file and checking the variables look as expected.", "Questions, reading and now data are in place, so the foundation of this study is laid. The analysis gets to start from solid ground."], "Analysis": ["The analysis is where all the preparation turns into answers. You now know what this study found, and every section still to come draws on exactly that.", "Analysis means many small choices about models, checks and what counts as a finding, and you worked through them. This paper has results to report.", "Analysis rarely runs in a straight line, with reruns and dead ends along the way. Reaching stable results is what matters, and you are there.", "With findings in hand, the writing has its raw material. Next session, you could write the main results as plain sentences before touching any section."], "Intro": ["The introduction now makes the case for why this study matters, the question every reader brings. The whole argument has its frame.", "Framing a problem so a busy reader cares usually means redrafting the same few paragraphs. You made the choices about what to put first, and they are on the page.", "A good share of this paper now exists in draft, and the introduction gives it a front door. That is a lot of work already standing.", "Introductions often take several passes, and this one is done for now. The next section can start with a brief sitting."], "Method": ["Sample, measures and procedure are now written in a form a reviewer can check. Anyone who wants to know how this study was done can find out.", "Method writing is exacting, getting every step precise enough for someone else to follow. That careful, unglamorous work is done.", "With the method written, this paper turns a corner. Most of what remains is about what you found and what it means.", "The method is done, and it is the kind of section that quietly holds a whole paper up. The first results table would make a tidy target for the next sitting, and a fine place to stop."], "Results": ["The findings are now laid out in tables and text that others can examine. That is what every other section points to.", "The core evidence of this paper is now written. The stretch still ahead is mostly interpretation and finishing.", "Turning output into clear tables and plain sentences is slow, careful work. It is done, and the Discussion now has something concrete to explain.", "When you next open this paper, you could list the findings the Discussion has to explain, and stop there. That list is the skeleton of the section."], "Discussion": ["The Discussion is where this study says what it adds, and that argument now exists. It is the section that turns results into a contribution.", "Placing your findings against the literature and naming the limits honestly takes judgment. That thinking is now on the page.", "The heaviest writing on this paper is behind you. What remains is the abstract, the details and any co-author read.", "If the abstract is next, lifting a key sentence from each section gives you a quick rough version. It is a small task with a clear edge."], "Abstract, refs, format": ["The fiddly finishing work is done, the kind nobody notices unless it is missing. This draft now looks like something a journal can receive.", "Only co-author sign-off and the submission itself remain. Most of the distance is already covered.", "The manuscript is ready to share. A short note to your co-authors with a reply-by date is a good next step.", "Detail work like this drains attention more than it shows. A good coffee or a short walk is a fair way to mark it."], "Co-author sign-off": ["Bringing several people to agree on the same version takes patience and tact, and it is done. This paper now has the whole team behind it.", "Chasing replies, merging tracked changes and settling disagreements rarely gets credit, yet joint papers depend on it. That work is done.", "With everyone on board, only the submission itself is left. This paper is about to leave your desk.", "When you next open this paper, you could draft the cover letter from the abstract and the journal's aims. It is a short job that clears the way to submit."], "Submitted": ["Submitting takes a finished argument, checked references and the nerve to let it go. This one deserves a real celebration, with your co-authors if you can!", "A quiet day after a big send is normal. Picking a small task on your next paper gives you an easy place to start again.", "Selective journals turn down most of what they receive, so whatever comes back is not a ruling on this study. Finishing and sending it was the part in your control, and that is done.", "This submission carries the work of everyone who read, argued and signed off. Letting them know it is out is a kind way to close this stage."], "R&R back": ["Reviews like these sting for nearly everyone who sends work out, and it is fine to let them sting for an evening. Tomorrow, the comment you can answer fastest is a good place to start.", "An R&R keeps this paper in play at the journal. A journal manager reports that most papers sent back for major revision at her journals were later accepted, though nothing is guaranteed.", "Hard reviews are a routine part of publishing, and they often feel lighter once each point has an answer. None of it is a verdict on whether you belong in this field.", "Much-published authors get plenty of revision requests too, and what often sets them apart is that they keep going. Answering these comments is how this paper keeps going too."], "Resubmitted": ["Working through the reviewer comments and writing the response letter is among the most careful writing in research. It is finished and back with the editor.", "Revision asks you to reopen work you thought was finished, and you did it. Staying with a paper through revision is often what gets it into print.", "The paper is out of your hands again, and the waiting is the editor's job now. The next session can go to whichever paper is closest to its own next stage.", "Sending a revision back is a milestone worth marking, and worth sharing with anyone who helped. Whatever the editor decides, this round is finished."], "Accepted": ["This is the one to celebrate out loud, with everyone who helped along the way! When the proofs arrive, a careful pass will close it out.", "The question this paper started with now has an answer others can read and build on. Every earlier stage was building toward this.", "This acceptance rests on carrying the paper through every stage, including the slow and difficult ones. The next paper in your queue can draw on that same persistence.", "Celebrate fully. Then, before the week ends, jotting down the smallest next task on another paper gives this energy somewhere to go."], "Partly done": ["Part of a stage is real movement. Papers get finished through steps this size.", "Getting back into a stage and moving it forward is often the hardest part, and it happened. What is already drafted is the place to pick up, not a fresh page.", "Before closing the file, you could jot down where you stopped and the next small step. Next time, that line is where you begin.", "This paper moved while other work also needed you. Partial progress alongside other demands is still progress, and it counts."]};
const ENC_SOURCES=[{"id": "p1", "principle": "Progress in meaningful work, even a small step, is the strongest everyday lift to motivation, and setbacks weigh more than equivalent wins. Recognition helps less and needs real progress to attach to. The data are correlational diaries from corporate knowledge workers, so applying them to paper stages is an extrapolation.", "citation": "Amabile, T. M., & Kramer, S. J. (2011). The power of small wins. Harvard Business Review, 89(5), 70-80 (reprint R1105C).", "url": "https://hbr.org/2011/05/the-power-of-small-wins"}, {"id": "p2", "principle": "Frame progress by whichever side is smaller. Early stages count what is done, later stages point to what is left. Effort resets lower right after a reward is earned, so name the next small step in the same message. The studies are consumer and lab settings, not manuscripts.", "citation": "Kivetz, R., Urminsky, O., & Zheng, Y. (2006). The goal-gradient hypothesis resurrected: Purchase acceleration, illusionary goal progress, and customer retention. Journal of Marketing Research, 43(1), 39-58. Koo, M., & Fishbach, A. (2012). The small-area hypothesis: Effects of progress monitoring on goal adherence. Journal of Consumer Research, 39(3), 493-509. Koo, M., & Fishbach, A. (2008). Dynamics of self-regulation: How (un)accomplished goal actions affect motivation. Journal of Personality and Social Psychology, 94(2), 183-195.", "url": "https://doi.org/10.1086/663827"}, {"id": "p3", "principle": "Goals work best with summary feedback showing progress against the goal, and a distant goal works better broken into proximal subgoals. The 13 stages are that breakdown. The subgoal evidence Locke and Latham cite is about complex tasks, mainly one business-game study.", "citation": "Locke, E. A., & Latham, G. P. (2002). Building a practically useful theory of goal setting and task motivation: A 35-year odyssey. American Psychologist, 57(9), 705-717. https://doi.org/10.1037/0003-066X.57.9.705", "url": "https://med.stanford.edu/content/dam/sm/s-spire/documents/PD.locke-and-latham-retrospective_Paper.pdf"}, {"id": "p4", "principle": "Close with one concrete if-then plan for the next small step (implementation intention), offered as a suggestion you can ignore.", "citation": "Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. Advances in Experimental Social Psychology, 38, 69-119. https://doi.org/10.1016/S0065-2601(06)38002-1", "url": "https://kops.uni-konstanz.de/handle/123456789/10973"}, {"id": "p5", "principle": "Acknowledge the work and the specific choices made (process), not traits or talent. The child praise result is contested (Li and Bates did not replicate the motivation effects), while the adult feedback meta-analysis points the same way (feedback that pulls attention to the self is less effective).", "citation": "Mueller, C. M., & Dweck, C. S. (1998). Praise for intelligence can undermine children's motivation and performance. Journal of Personality and Social Psychology, 75(1), 33-52. Kluger, A. N., & DeNisi, A. (1996). The effects of feedback interventions on performance: A historical review, a meta-analysis, and a preliminary feedback intervention theory. Psychological Bulletin, 119(2), 254-284. Li, Y., & Bates, T. C. (2019). You can't change your basic ability, but you work at things, and that's how we get hard things done: Testing the role of growth mindset on response to setbacks, educational attainment, and cognitive ability. Journal of Experimental Psychology: General, 148(9), 1640-1655. Yeager, D. S., & Dweck, C. S. (2020). What can be learned from growth mindset controversies? American Psychologist, 75(9), 1269-1284.", "url": "https://doi.org/10.1037/0022-3514.75.1.33"}, {"id": "p6", "principle": "Positive feedback raises intrinsic motivation, more for college students than children, when it informs about competence rather than pressures. Wording such as should, must or keep up the good work made praise controlling and undermining in the studies. That contrast rests on four small experiments.", "citation": "Deci, E. L., Koestner, R., & Ryan, R. M. (1999). A meta-analytic review of experiments examining the effects of extrinsic rewards on intrinsic motivation. Psychological Bulletin, 125(6), 627-668. Henderlong, J., & Lepper, M. R. (2002). The effects of praise on children's intrinsic motivation: A review and synthesis. Psychological Bulletin, 128(5), 774-795.", "url": "https://doi.org/10.1037/0033-2909.125.6.627"}, {"id": "p7", "principle": "Praise only works if believed, so keep it specific, earned and proportionate to the stage. The review is about children, and the authors call this part largely speculative (opinion, not tested).", "citation": "Henderlong, J., & Lepper, M. R. (2002). The effects of praise on children's intrinsic motivation: A review and synthesis. Psychological Bulletin, 128(5), 774-795.", "url": "https://www.reed.edu/psychology/motivation/assets/downloads/Henderlong_Lepper_2002.pdf"}, {"id": "p8", "principle": "After a setback, offer self-compassion (name the feeling, note it is shared, one kind next step) rather than self-esteem boosting.", "citation": "Breines, J. G., & Chen, S. (2012). Self-compassion increases self-improvement motivation. Personality and Social Psychology Bulletin, 38(9), 1133-1143, doi:10.1177/0146167212445599. Neff, K. D., Hsieh, Y.-P., & Dejitterat, K. (2005). Self-compassion, achievement goals, and coping with academic failure. Self and Identity, 4, 263-287, doi:10.1080/13576500444000317.", "url": "https://doi.org/10.1177/0146167212445599"}, {"id": "p9", "principle": "Point to the next short session, not a marathon. Boice's samples were small groups of volunteer, self-identified procrastinators on local campuses and were never replicated (Sword 2016), so treat this as suggestive.", "citation": "Boice, R. (1997). Which is more productive, writing in binge patterns of creative illness or in moderation? Written Communication, 14(4), 435-459. Silvia, P. J. (2007). How to write a lot: A practical guide to productive academic writing. Washington, DC: APA (2nd ed. 2018).", "url": "https://gwern.net/doc/psychology/writing/1997-boice.pdf"}, {"id": "p10", "principle": "There is no single right writing rhythm. Credit whatever rhythm got the stage done and drop guilt language. Descriptive interview and questionnaire data, not an intervention trial.", "citation": "Sword, H. (2016). 'Write every day!': A mantra dismantled. International Journal for Academic Development, 21(4), 312-322. https://doi.org/10.1080/1360144X.2016.1210153", "url": "https://www.research.ucsb.edu/sites/default/files/RD/docs/Write-every-day-a-mantra-dismantled.pdf"}, {"id": "p11", "principle": "Writing is helped by social support and accountability. Honour collaborators and frame hand-offs as progress. No study isolates co-authorship itself, so the co-author framing is expert practice.", "citation": "McGrail, M. R., Rickard, C. M., & Jones, R. (2006). Publish or perish: A systematic review of interventions to increase academic publication rates. Higher Education Research & Development, 25(1), 19-35. Skarupski, K. A., & Foucher, K. C. (2018). Writing Accountability Groups (WAGs): A tool to help junior faculty members build sustainable writing habits. Journal of Faculty Development, 32(3), 47-54. Kornhaber, R., Cross, M., Betihavas, V., & Bridgman, H. (2016). The benefits and challenges of academic writing retreats: An integrative review. Higher Education Research & Development, 35(6), 1210-1227. Belcher, W. L. (2019). Writing your journal article in twelve weeks (2nd ed.). University of Chicago Press.", "url": "https://researchportalplus.anu.edu.au/en/publications/publish-or-perish-a-systematic-review-of-interventions-to-increas/"}, {"id": "p12", "principle": "Mark small stages with small rewards that do not cost writing time (Silvia warns against rewarding writing by skipping writing), and save a real celebration for milestones such as submission and acceptance (Belcher closes her submission week with send and celebrate). Expert advice, not tested experimentally.", "citation": "Silvia, P. J. (2007/2018). How to write a lot. APA, as summarized in Barnhill, G. (2020, June 30). Book review: How to write a lot by Paul J. Silvia. Baylor Graduate Writing Center blog. Belcher, W. L. (2019). Writing your journal article in twelve weeks (2nd ed.). University of Chicago Press.", "url": "https://blogs.baylor.edu/gwc/2020/06/30/book-review-how-to-write-a-lot-by-paul-j-silvia/"}, {"id": "p13", "principle": "Rejection and R&R are the normal cost of publishing, and persistence rather than worthiness is often what separates much-published authors from unpublished ones. Expert argument, not trials.", "citation": "Belcher, W. L. (2012, Nov 13). Successful academic writers persist despite rejection. PhD2Published (excerpt from Writing your journal article in twelve weeks). Silvia, P. J. (2007). How to write a lot, pp. 100-101, as reported in Dearing, R. L. (2007), PsycCRITIQUES 52(27). doi:10.1037/a0008247", "url": "https://www.phd2published.com/2012/11/13/successful-academic-writers-persist-despite-rejection-wendy-laura-belcher/"}, {"id": "p14", "principle": "To restart a stalled stage, forgive the delay without mentioning it, and pick up from existing notes or drafts rather than a blank page. Correlational data from first-year students plus expert practice.", "citation": "Wohl, M. J. A., Pychyl, T. A., & Bennett, S. H. (2010). I forgive myself, now I can study: How self-forgiveness for procrastinating can reduce future procrastination. Personality and Individual Differences, 48(7), 803-808. Gollwitzer, P. M., & Sheeran, P. (2006). Implementation intentions and goal achievement: A meta-analysis of effects and processes. Advances in Experimental Social Psychology, 38, 69-119. Belcher (2019), Introduction.", "url": "https://dn790006.ca.archive.org/0/items/affective-cognitive-and-behavioral-differences-bet/I_forgive_myself_now_I_can_study_How_sel.pdf"}, {"id": "p15", "principle": "Selective journals reject most submissions (APA journals averaged a 70% rejection rate in 2023, and the global average acceptance rate is estimated at about 35-40%), so a no is the ordinary outcome and not a ruling on the study. In one large survey of biology journals, roughly a quarter of published articles had first been submitted to another journal.", "citation": "American Psychological Association (2024). Summary report of journal operations, 2023. American Psychologist, 79(5), 777-778, doi:10.1037/amp0001383. Björk, B.-C. (2019). Acceptance rates of scholarly peer-reviewed journals: A literature survey. El Profesional de la Información, 28(4), e280407, doi:10.3145/epi.2019.jul.07. Calcagno, V., Demoinet, E., Gollner, K., Guidi, L., Ruths, D., & de Mazancourt, C. (2012). Flows of research manuscripts among scientific journals reveal hidden submission patterns. Science, 338(6110), 1065-1069.", "url": "https://www.apa.org/pubs/journals/features/2023-statistics.pdf"}, {"id": "p16", "principle": "Frame a setback as common and temporary, and as no evidence that you do not belong in the field. Undergraduate samples, so applying it to peer review is an inference.", "citation": "Walton, G. M., & Cohen, G. L. (2011). A brief social-belonging intervention improves academic and health outcomes of minority students. Science, 331(6023), 1447-1451. Walton, G. M., Murphy, M. C., Logel, C., Yeager, D. S., Goyer, J. P., Brady, S. T., et al. (2023). Where and with whom does a brief social-belonging intervention promote progress in college? Science, 380(6644), 499-505.", "url": "https://doi.org/10.1126/science.1198364"}, {"id": "p17", "principle": "Treat an R&R as a strong forward step, honestly and without a guarantee. The source is one publishing executive's figure (80-90%) for major-revision papers at journals she has managed, which she does not name. It is not a systematic study.", "citation": "Cochran, A. (2022, August 22). Revisiting: Should you 'revise and resubmit'? Probably. The Scholarly Kitchen (repost of her 2016 post).", "url": "https://scholarlykitchen.sspnet.org/2022/08/22/revisiting-should-you-revise-and-resubmit-probably/"}, {"id": "p18", "principle": "Acknowledge workload and competing demands rather than treating slow progress as a mindset problem. Cross-sectional data from PhD students in Flanders, so applying it to other researchers is an inference.", "citation": "Levecque, K., Anseel, F., De Beuckelaer, A., Van der Heyden, J., & Gisle, L. (2017). Work organization and mental health problems in PhD students. Research Policy, 46(4), 868-879, doi:10.1016/j.respol.2017.02.008.", "url": "https://kclpure.kcl.ac.uk/ws/files/79473041/Work_organization_and_mental_LEVECQUE_Publishedonline13March2017_GREEN_AAM_CC_BY_NC_ND_.pdf"}];

function graft(root,html,keep){const tmp=document.createElement("div");tmp.innerHTML=html;const nu=tmp.querySelector(`[data-pickup="${CSS.escape(keep.dataset.pickup)}"]`);if(!nu)return false;
  const L=[],F=[];for(let x=keep;x&&x!==root;x=x.parentElement)L.push(x);for(let x=nu;x&&x!==tmp;x=x.parentElement)F.push(x);
  if(L.length!==F.length||L.some((x,i)=>x.tagName!==F[i].tagName)||L[L.length-1].parentElement!==root)return false;L.push(root);F.push(tmp);
  for(let i=L.length-1;i>0;i--){const lp=L[i],fp=F[i],lc=L[i-1],fc=F[i-1];
    if(lp!==root){[...lp.attributes].forEach(a=>{if(!fp.hasAttribute(a.name))lp.removeAttribute(a.name)});[...fp.attributes].forEach(a=>{if(lp.getAttribute(a.name)!==a.value)lp.setAttribute(a.name,a.value)})}
    [...lp.childNodes].forEach(n=>{if(n!==lc)n.remove()});let before=true;[...fp.childNodes].forEach(n=>{if(n===fc)before=false;else if(before)lp.insertBefore(n,lc);else lp.appendChild(n)})}
  return true}

function ctlKey(a){if(!a||!a.attributes)return"";if(a.id)return"#"+CSS.escape(a.id);const q=v=>`"${CSS.escape(v)}"`;

function applyMove(id,zone,index){const p=S.papers[id];if(!p)return;
  if(zone==="focus"&&!writable(p)){toast(status(p)==="writing"?"It is marked waiting on others. Untick that in its details first.":isGrant(p)?"It is with the funder, nothing to write on it yet.":"It is with the journal or editors, nothing to write on it yet.");render();return}const cur=currentIds();
  const beforeOrd={};Object.values(S.papers).filter(inPool).forEach(q=>beforeOrd[q.id]=q.order??null);const beforeRole={userRole:p.userRole??null,roleByUser:!!p.roleByUser};
  ["focus","main","co"].forEach(z=>cur[z]=cur[z].filter(x=>x!==id));
  if(zone==="focus"){const prev=cur.focus[0];cur.focus=[id];if(prev){cur[role(S.papers[prev]).main?"main":"co"].unshift(prev)}}
  else cur[zone].splice(Math.max(0,Math.min(index,cur[zone].length)),0,id);
  if(!cur.focus.length){const take=z=>{const k=cur[z].findIndex(x=>x!==id&&writable(S.papers[x]));return k<0?null:cur[z].splice(k,1)[0]};const nx=take("main")||take("co");if(nx)cur.focus=[nx]}
  const seq=[...cur.focus,...cur.main,...cur.co];
  seq.forEach((pid,i)=>{if(ordOf(S.papers[pid])!==i+1)writePaper(pid,{order:i+1})});
  let roleNote="";
  if(zone!=="focus"){const wantMain=zone==="main";if(role(p).main!==wantMain){writePaper(id,{userRole:wantMain?"Lead":"Co-author",roleByUser:true,confirmed:true});roleNote=wantMain?" Now main author.":" Now co-author."}}

function aiFormFrom(v){const f={prov:v&&AI_DEF[v.provider]?v.provider:"none",model:{},base:{}};

  db.collection("scan").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(d.id==="_run")S.run=v;else if(d.id==="_new")S.newFolders=Array.isArray(v.folders)?v.folders:[];else m[d.id]=v});S.scans=m;render()},()=>{});

  db.collection("timelog").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.tlSeen={...m};Object.keys(tlOps).forEach(k=>{m[k]=tlApply(k,m[k])});
    S.tlog=m;S.tlogReady=true;gate("tl",snap,tlOpen);render();
    if(S.tpOpen){midTap()?tpLater():renderTimePanel(tpBusy(document.activeElement))}},()=>{S.tlogReady=true;tlOpen()});
  db.collection("week").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});
    if(W.wk!==false)overlay("wk",m,"weeks",S.wkDirty,"wk_",rebase);else Object.keys(S.weeks).forEach(k=>{if(timers["wk_"+k]&&S.weeks[k])m[k]=S.weeks[k]});
    /* a goal form saved before the last reload: once the store answers for sure, forget it when the store has what the user typed, else give it back */
    const gp=S.gdBoot;if(gp&&!(snap.metadata&&snap.metadata.fromCache)){S.gdBoot=null;const r=m[gp.pend],has=!!(r&&goalSig(r)===gp.sig);if(S.gdPend===gp){S.gdPend=null;
      if(!has&&!S.gd){S.gd={for:gp.for,v:gp.v};toast("Your last goal was not saved. What you typed is kept in the goal form.")}saveGD()}
      /* the user opened the form before this answer and got their text back in it. The store has that goal after all, so the form closes, unless they changed it or are typing in it */
      else if(S.gdAsk===gp){S.gdAsk=null;const a=document.activeElement;if(has&&S.gd&&same(S.gd.v,gp.v)&&!(a&&a.closest&&a.closest("#goalSec"))){S.gd=null;saveGD();toast("Your goal was saved after all.")}}}
    S.weeks=m;S.weeksReady=true;gate("wk",snap,wkOpen);render();
    if(S.tpOpen){midTap()?tpLater():renderTimePanel(tpBusy(document.activeElement))}},()=>{S.weeksReady=true});
  db.collection("cfp").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.cfp=m;refreshDrawer()},()=>{});
  db.collection("plan").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});const ok=sure(snap),raw={...m};if(!ok)gate("pl",snap,plOpen);
    /* the first snapshot: pieces the user added before it are joined to the stored ones. While only the cache has answered, writePlan keeps them waiting */
    if(!S.plansReady){const q=[...(S.plDirty||[])];S.plansReady=true;S.plDirty=null;
      q.forEach(k=>{const r=m[k]||{},rp=Array.isArray(r.pieces)?r.pieces:[],ids=new Set(rp.map(x=>x&&x.id));m[k]={...r,pieces:[...rp,...piecesOf({id:k}).filter(x=>!ids.has(x.id))]}});S.plans=m;q.forEach(k=>writePlan(k,m[k].pieces))}
    else if(W.pl!==false){overlay("pl",m,"plans",S.plDirty,"pl_",rebasePlan);S.plans=m}
    else{Object.keys(S.plans).forEach(k=>{if(timers["pl_"+k]&&S.plans[k])m[k]=S.plans[k]});S.plans=m}
    if(W.pl!==false)BASE.pl=raw;if(ok)gate("pl",snap,plOpen);render();if(T)renderTimer()},()=>{S.plFail=true;toast("Could not load your pieces. Reload the page before you add pieces.")});
  watchFocus();
  db.doc("journals/list").onSnapshot(d=>{S.journals=d.exists?d.data():null;if(!$("#settingsBox").hidden&&!pendingList)renderSettings();refreshDrawer()},()=>{});
  db.collection("venues").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.venues=m;refreshDrawer()},()=>{});
  db.collection("context").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S.ctx=m;S.ctxReady=true;render()},()=>{S.ctxLate=true;render()});
  setTimeout(()=>{if(!S.ctxReady&&!S.ctxLate){S.ctxLate=true;render()}},1e4);
  /* set() replaces the settings, so a change made before they arrive is merged into them first */
  db.doc("config/settings").onSnapshot(d=>{const dirty=S.settingsReady?null:S.setDirty||{};S.settingsReady=true;S.setDirty=null;
    if(d.exists&&!timers._s){S.settings={...DEFAULTS,...d.data(),...(dirty||{})};const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.setting)&&!$("#settingsBox").hidden)renderSettings();render()}
    if(dirty&&Object.keys(dirty).length)Object.entries(dirty).forEach(([k,v])=>saveSettings(k,v))},()=>{});
})();
</script>
